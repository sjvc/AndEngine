buildscript {
    repositories {
        google()
        mavenCentral()
    }
}


apply plugin: 'com.android.library'

android {
    compileSdk 36

    namespace 'org.andengine'

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
        minSdk 23
        targetSdk 36
    }

    buildFeatures {
        buildConfig true
    }
}